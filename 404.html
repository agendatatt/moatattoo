<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página não encontrada | Moacir Almeida Tattoo</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/moatattoo/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
/* fonte de reserva com a mesma largura da real: sem isso a pagina pula quando a fonte carrega (etapa 3) */
@font-face{font-family:'Jost reserva'; src:local('Segoe UI'),local('Helvetica Neue'),local('Arial'); size-adjust:95.6%;}
@font-face{font-family:'Cormorant reserva'; src:local('Georgia'),local('Times New Roman'); size-adjust:89.4%;}

  :root{--black:#0a0a0a;--gold:#c9a96e;--gold-light:#e0c998;--cream:#f5f0e8;--text:#d4cfc7;--muted:#a8a094;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--black);color:var(--text);font-family:'Jost','Jost reserva',sans-serif;font-weight:300;
       text-align:center;padding:32px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  .n{font-family:'Cormorant Garamond','Cormorant reserva',serif;font-size:clamp(72px,16vw,140px);color:var(--gold);line-height:1;margin:0 0 8px;font-style:italic;}
  h1{font-family:'Cormorant Garamond','Cormorant reserva',serif;font-weight:300;font-size:clamp(26px,5vw,38px);color:var(--cream);margin:0 0 14px;}
  p{color:var(--muted);max-width:44ch;margin:0 auto 32px;}
  .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
  a.btn{display:inline-block;padding:14px 28px;font-size:14px;letter-spacing:.16em;
        text-transform:uppercase;border:1px solid var(--gold);text-decoration:none;transition:background .2s,color .2s;}
  .solid{background:var(--gold);color:var(--black);font-weight:400;}
  .solid:hover{background:var(--gold-light);}
  .ghost{color:var(--gold);}
  .ghost:hover{background:rgba(201,169,110,.12);color:var(--gold-light);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

/* leitura e area de toque (etapa 2) */
@media (max-width:980px){
  .topbar nav a:not(.nav-cta), .subnav a, .foot a, .filters button{min-height:44px; display:inline-flex; align-items:center;}
  .topbar nav .nav-cta{min-height:44px; display:inline-flex; align-items:center; justify-content:center;}
  .filters button{padding-top:12px; padding-bottom:12px;}
  .score-side a, .ad-acoes .btn{min-height:44px;}
  .brand{min-height:44px; display:inline-flex; align-items:center;}
}

/* === INICIO AJUSTES DE LEITURA 21-09-2026 === */
/* Texto que o cliente le de verdade: maior e em --text (era 15px em --muted).
   O publico e de primeira tatuagem, lendo no celular. */
.service p,.step p,.article p,.porta-txt p,.review blockquote p{font-size:16.5px;color:var(--text);}
.portas-mais,.hero-local{font-size:16px;}
.faq .ans{font-size:16.5px;color:var(--text);}
.contact .intro{color:var(--text);}
.faixa small{font-size:14px;}
.sessoes p.m{font-size:15px;}
/* Piso de 12px nos rotulos minusculos (havia 11px). Nao mexe nos que ja sobem
   pra 13px no celular -- esses estao no @media abaixo. */
.scroll-hint,.tile .badge,.stats span,.lb figcaption span,.article .cat,
.reels-dica,.reel-tag,.pcard .label small,.tile .meta small{font-size:12px;}
/* Sem palavra orfa no fim do paragrafo e titulo quebrado em linhas parelhas */
p,li{text-wrap:pretty;}
h2,h3{text-wrap:balance;}
/* Area de toque: links de contato e rodape tinham 22-23px de altura */
.legal a,.foot a,.info a,.info li a,.contact a:not(.btn){display:inline-block;padding-block:10px;}
@media (max-width:980px){
  .service p,.step p,.article p,.porta-txt p,.faq .ans,.review blockquote p{font-size:17px;}
  .article .cat{font-size:13px;}
}
/* === FIM AJUSTES DE LEITURA 21-09-2026 === */

/* === INICIO CANTOS ARREDONDADOS 21-09-2026 === */
:root{--r:14px;--r-img:12px;}
/* caixas */
.review,.service,.article,.sessoes,.gbadge,.info,.datas{border-radius:var(--r);}
/* fotos e video: o recorte precisa de overflow no pai */
.pcard .face,.tile .card,.ad-fotos figure,.vid-frame{border-radius:var(--r);overflow:hidden;}
.pcard img,.tile img,.ad-fotos img,.corpo figure img{border-radius:var(--r-img);}
/* video: o arredondado vai na .reel-v, que e quem desenha a borda (ela fica
   dourada no hover). No video em si sobraria um canto quadrado por baixo. */
.reel-v{border-radius:var(--r);}
.reel video{border-radius:0;}
.reel-cta{border-radius:var(--r-img);}
.reel-tag{border-radius:999px;}
.ad-fotos figure img,.pcard .face img,.tile .card img{border-radius:0;}
/* botoes */
.btn,.filters button,.mais-trabalhos button,.topbar nav .nav-cta{border-radius:var(--r-img);}
.chips li,.tile .badge{border-radius:999px;}
/* === FIM CANTOS ARREDONDADOS 21-09-2026 === */

/* === INICIO TEMA CLARO 21-09-2026 === */
@media (prefers-color-scheme: light){
  :root{
    --black:#17140f;   /* NAO e o fundo no claro: e o texto do botao dourado */
    --deep:#f6f3ee;
    --card:#ffffff;
    --border:#e4ded3;
    --gold:#7a6033;         /* escurecido: aqui ele e texto e borda (4,9:1) */
    --gold-light:#63491f;
    --cream:#1a1613;        /* era o branco dos titulos */
    --text:#34302a;
    --muted:#6b6459;
  }
  body{background:#fbf9f6;}
  /* barras translucidas eram pretas. Nos artigos e .topbar; na home, .topbar.solid */
  .topbar,.topbar.solid{background:rgba(251,249,246,.85);}
  /* a barra fixa do WhatsApp e redefinida num <style> no fim das paginas
     internas, com cor literal; por isso as regras dela vem repetidas aqui */
  .barra-wa{background:rgba(251,249,246,.96);border-top-color:#e4ded3;}
  .barra-wa .txt{color:#6b6459;}
  .barra-wa .txt b{color:#1a1613;}
  .chips li{background:#f2eee6;}
  /* Botoes dourados: mantem o dourado original, com texto escuro em cima.
     O --gold escurecido serve pra texto, mas como FUNDO perderia contraste.
     Nos artigos o botao e .btn puro; na home e .btn-solid. O ghost (borda,
     sem fundo) e a barra verde do WhatsApp ficam de fora. */
  .btn:not(.btn-ghost):not(.ghost),.topbar nav .nav-cta,.btn-ghost:hover,
  .filters button[aria-pressed="true"],.mais-trabalhos button:hover{
    background:#c9a96e;border-color:#c9a96e;color:#17140f;
  }
  .barra-wa .btn{background:#25d366;border-color:#25d366;color:#062e16;}
  /* escala de dor dos artigos: as duas pontas sobre fundo claro */
  :root{--p1:#2e7d52;--p5:#c62828;}
  .gbadge .stars,.rating .stars,.review .stars{color:#b8860b;}
  /* os raios e o brilho do hero sao luz sobre preto */
  .rays{opacity:.18;}
  .glow{opacity:.30;}
  /* a bolinha do passo era escura sobre escuro */
  .step .dot{background:#17140f;color:#fbf9f6;}
  /* Texto POR CIMA de foto ou video continua claro: ali o fundo e a imagem,
     nao a pagina. Sem isso o rotulo escurece e some dentro da foto. */
  .pcard .label,.stage .pcard .estilo,.tile .badge,.ad-fotos figcaption,
  .lb figcaption,.lb button,.ba .tag,.flip .face .tag,.tile .nfotos{color:#f5f0e8;}
  .ba .tag.d,.flip .front .tag{color:#e8d3a4;}
  /* .reel-tag vem do reels.css, que carrega depois deste <style>:
     precisa de seletor mais especifico pra ganhar dele */
  .reels .reel-tag{color:#f5f0e8;}
  .lb figcaption span{color:#cec7bb;}
  .reel-play{color:#e8d3a4;}
  /* o selo do Google tinha fundo escuro proprio: vira cartao branco */
  .gbadge{background:#fff;}
  .gbadge:hover{color:var(--cream);}
  /* Cards cujo fundo e gradiente com hex fixo (nao usavam var, entao o tema
     nao os alcancava e ficavam cinza-escuro com texto escuro em cima). */
  .service,.ad-bloco,.style{background:linear-gradient(160deg,#ffffff,#f4f1ea);}
  .closer-card::after{background:radial-gradient(ellipse at 50% 0%,#fffdf9,#f2eee6 60%);}
  .wa-opt:hover{background:#f2eee6;}
  .review .av{background:#efeae1;}
}
/* === FIM TEMA CLARO 21-09-2026 === */
</style>
