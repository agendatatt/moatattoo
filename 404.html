/* === INICIO BOTAO DE TEMA 21-09-2026 === */
/* botao de tema: discreto, ao lado do Orcamento */
.tema-bt{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;padding:0;background:none;border:1px solid var(--border);

   linhas no desktop e o Orcamento encosta na borda no celular */

  .tema-bt{width:38px;height:38px;}
  .tema-bt svg{width:15px;height:15px;}

}

<script>
/* botao de tema: alterna e guarda a escolha */
(function () {
  var bt = document.querySelector('.tema-bt');
  if (!bt) return;
  var raiz = document.documentElement;
  function efetivo() {
    var a = raiz.getAttribute('data-tema');
    if (a === 'claro' || a === 'escuro') return a;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'escuro';
  }
  function rotula() {
    bt.setAttribute('aria-label', efetivo() === 'claro' ? 'Mudar para o tema escuro' : 'Mudar para o tema claro');
  }
  rotula();
  bt.addEventListener('click', function () {
    var novo = efetivo() === 'claro' ? 'escuro' : 'claro';
    raiz.setAttribute('data-tema', novo);
    try { localStorage.setItem('tema', novo); } catch (e) {}
    rotula();
  });
})();
</script>
